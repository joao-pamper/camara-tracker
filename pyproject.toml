[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camara-tracker"
version = "0.1.0"
description = "Ingest Brazilian Chamber of Deputies open data into Parquet files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pyarrow",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
]

[project.scripts]
camara-tracker = "camara_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live' --cov=camara_tracker --cov-report=term-missing"
markers = ["live: makes a real request to the public Câmara API"]
